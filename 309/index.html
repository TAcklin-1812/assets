<!DOCTYPE html>
<html lang="en">
<head>
    <base href="https://cdn.jsdelivr.net/gh/gn-math/gn-math.github.io@main/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>T's Unblocked Games</title>
    <meta name="description" content="Play free browser games with no downloads.">
    <link rel="icon" type="image/png" href="favicon.png">

    <style>
        :root {
            --primary: #000;
            --text: #fff;
            --background: #0f172a;
            --card: #252525;
            --border: #383838;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
            overflow-x: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            font-family: "Segoe UI", Tahoma, sans-serif;
            color: var(--text);
            background: var(--background);
        }

        body.no-scroll {
            overflow: hidden;
        }

        body.light-mode {
            --text: #222;
            --background: #fff;
            --card: #f1f1f1;
            --border: #ccc;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 1rem;
            color: var(--text);
            background: var(--primary);
        }

        .header-content {
            display: flex;
            align-items: center;
            gap: 1rem;
            max-width: 1200px;
            margin: auto;
        }

        .logo {
            flex: 1;
            min-width: 200px;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .search-container {
            display: flex;
            flex: 2;
            gap: 10px;
        }

        input,
        select,
        button {
            font: inherit;
        }

        #searchBar,
        #sortOptions,
        button {
            padding: .5rem;
            border: 1px solid var(--border);
            border-radius: 4px;
        }

        #searchBar,
        #sortOptions {
            color: var(--text);
            background: var(--card);
        }

        #searchBar {
            flex: 1;
            min-width: 0;
        }

        button {
            cursor: pointer;
        }

        #settings {
            width: 100%;
            color: var(--text);
            background: var(--primary);
            border: 0;
        }

        main {
            flex: 1;
            width: 100%;
            max-width: 1200px;
            margin: auto;
            padding: 1rem;
        }

        #container,
        #featuredZones {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            margin-top: 1rem;
        }

        .zone-item {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            cursor: pointer;
            background: var(--background);
            border: 5px solid var(--border);
            border-radius: 8px;
        }

        .zone-item:hover {
            filter: brightness(1.15);
        }

        .zone-item img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            background: #333;
        }

        .zone-item button {
            min-height: 60px;
            color: var(--text);
            font-weight: bold;
            background: var(--primary);
            border: 0;
            border-radius: 0;
        }

        #zoneViewer {
            position: fixed;
            inset: 0;
            z-index: 10000;
            display: none;
            flex-direction: column;
            background: var(--background);
        }

        .zone-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: .5rem 1rem;
        }

        .zone-title {
            flex: 1;
            min-width: 0;
        }

        #zoneName {
            margin: 0;
            font-size: 1.2rem;
        }

        #zoneAuthor {
            color: var(--text);
        }

        .zone-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .zone-controls button {
            color: var(--text);
            background: var(--background);
            border-color: var(--text);
        }

        .zone-content,
        .bad-piggies-fix {
            display: flex;
            flex: 1;
            min-height: 0;
            flex-direction: column;
        }

        #zoneFrame {
            width: 100%;
            height: 100%;
            flex: 1;
            border: 0;
        }

        #popupOverlay {
            position: fixed;
            inset: 0;
            z-index: 20000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            background: rgb(0 0 0 / 70%);
        }

        .popup {
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            overflow: auto;
            color: var(--text);
            background: var(--card);
            border-radius: 8px;
        }

        .popup-header {
            display: flex;
            justify-content: space-between;
            padding: .8rem 1rem;
            background: var(--primary);
        }

        .popup-header h3 {
            margin: 0;
        }

        #popupClose {
            color: var(--text);
            background: transparent;
            border: 0;
            font-size: 1.5rem;
        }

        #popupBody {
            padding: 1rem;
        }

        #popupBody input,
        #popupBody select,
        #popupBody button,
        textarea {
            width: 100%;
            margin: .5rem 0;
            padding: .5rem;
            color: var(--text);
            background: var(--background);
            border: 1px solid var(--border);
            border-radius: 4px;
        }

        #popupBody button {
            background: var(--primary);
        }

        footer {
            padding: 1rem;
            text-align: center;
            background: var(--card);
            border-top: 1px solid var(--border);
        }

        .footer-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }

        .footer-links a,
        .footer-links label {
            color: var(--text);
            cursor: pointer;
        }

        .game-fullscreen {
            position: fixed !important;
            inset: 0 !important;
            z-index: 9999999 !important;
            width: 100vw !important;
            height: 100vh !important;
        }

        @media (max-width: 768px) {
            .header-content,
            .search-container {
                flex-direction: column;
                align-items: stretch;
            }

            .logo {
                min-width: 0;
                text-align: center;
            }

            #container,
            #featuredZones {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            }

            .zone-header {
                align-items: stretch;
                flex-direction: column;
            }

            .zone-controls {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="header-content">
            <div class="logo">T's Unblocked Games</div>

            <div class="search-container">
                <input id="searchBar" type="search" placeholder="Search zones...">
                <select id="sortOptions">
                    <option value="name">Name</option>
                    <option value="id">ID (Date)</option>
                    <option value="popular">Popular</option>
                </select>
            </div>

            <button id="settings" type="button">Settings</button>
        </div>
    </header>

    <main>
        <details open>
            <summary id="featuredSummary">Featured Zones</summary>
            <div id="featuredZones"></div>
        </details>

        <hr>

        <details open>
            <summary id="allSummary">All Zones</summary>
            <div id="container">Loading...</div>
        </details>
    </main>

    <section id="zoneViewer" aria-hidden="true">
        <div class="zone-header">
            <div class="zone-title">
                <h2 id="zoneName">Zone</h2>
                <span id="zoneId"></span>
                <a id="zoneAuthor" href="#" target="_blank" rel="noopener">by Author</a>
            </div>

            <div class="zone-controls">
                <button id="fullscreenBtn" type="button">Fullscreen</button>
                <button id="newTabBtn" type="button">Open in New Tab</button>
                <button id="downloadBtn" type="button">Download</button>
                <button id="closeBtn" type="button">Close</button>
            </div>
        </div>

        <div class="zone-content">
            <div class="bad-piggies-fix">
                <iframe
                    id="zoneFrame"
                    title="Game"
                    allow="autoplay; fullscreen; clipboard-write"
                    allowfullscreen
                    sandbox="allow-same-origin allow-scripts allow-popups allow-forms allow-pointer-lock allow-downloads allow-modals allow-orientation-lock">
                </iframe>
            </div>
        </div>
    </section>

    <div id="popupOverlay">
        <div class="popup" role="dialog" aria-modal="true">
            <div class="popup-header">
                <h3 id="popupTitle">Settings</h3>
                <button id="popupClose" type="button" aria-label="Close">×</button>
            </div>
            <div id="popupBody"></div>
        </div>
    </div>

    <footer>
        <div class="footer-links">
            <a href="#" id="contactLink">Contact</a>
            <a href="#" id="privacyLink">Privacy Policy</a>
            <a href="#" id="exportLink">Export Data</a>
            <label for="importData">Import Data</label>
            <input id="importData" type="file" accept=".json,application/json" hidden>
        </div>
    </footer>

    <script>
        "use strict";

        const zonesURL =
            "https://raw.githubusercontent.com/gn-math/assets/main/zones.json";
        const coverURL =
            "https://raw.githubusercontent.com/gn-math/covers/main";
        const htmlURL =
            "https://raw.githubusercontent.com/gn-math/html/main";

        const container = document.getElementById("container");
        const featuredContainer = document.getElementById("featuredZones");
        const searchBar = document.getElementById("searchBar");
        const sortOptions = document.getElementById("sortOptions");
        const zoneViewer = document.getElementById("zoneViewer");
        const zoneFrame = document.getElementById("zoneFrame");
        const fullscreenBtn = document.getElementById("fullscreenBtn");
        const zoneAuthor = document.getElementById("zoneAuthor");
        const popupOverlay = document.getElementById("popupOverlay");

        let zones = [];
        let popularityData = {};
        let currentZone = null;
        let isFullscreen = false;
        let loadController = null;

        const adPatterns = [
            /doubleclick\.net/i,
            /googlesyndication\.com/i,
            /googleadservices\.com/i,
            /googletagmanager\.com/i,
            /google-analytics\.com/i,
            /adservice\.google/i,
            /adsystem/i,
            /adserver/i,
            /advert/i,
            /propellerads/i,
            /popunder/i,
            /popup/i,
            /monetag/i,
            /exoclick/i,
            /trafficjunky/i
        ];

        function debounce(callback, delay) {
            let timer;
            return (...args) => {
                clearTimeout(timer);
                timer = setTimeout(() => callback(...args), delay);
            };
        }

        function resolveUrl(value) {
            const resolved = String(value || "")
                .replaceAll("{COVER_URL}", coverURL)
                .replaceAll("{HTML_URL}", htmlURL);

            try {
                return new URL(resolved, document.baseURI).href;
            } catch {
                return resolved;
            }
        }

        function addCacheBuster(url) {
            return url + (url.includes("?") ? "&" : "?") + "t=" + Date.now();
        }

        function fallbackImage() {
            return "data:image/svg+xml;charset=utf-8," +
                encodeURIComponent(
                    '<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200">' +
                    '<rect width="100%" height="100%" fill="#333"/>' +
                    '<text x="50%" y="50%" fill="white" text-anchor="middle">' +
                    "No Image</text></svg>"
                );
        }

        function loadImage(image) {
            const source = image.dataset.src || fallbackImage();
            const testImage = new Image();

            testImage.onload = () => {
                image.src = source;
            };

            testImage.onerror = () => {
                image.src = fallbackImage();
            };

            testImage.src = source;
        }

        const imageObserver = new IntersectionObserver((entries, observer) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    loadImage(entry.target);
                    observer.unobserve(entry.target);
                }
            });
        });

        function createZoneItem(zone) {
            const item = document.createElement("div");
            item.className = "zone-item";
            item.addEventListener("click", () => openZone(zone));

            const image = document.createElement("img");
            image.dataset.src = zone.cover
                ? resolveUrl(zone.cover)
                : fallbackImage();
            image.alt = zone.name || "Game cover";
            item.appendChild(image);

            const button = document.createElement("button");
            button.type = "button";
            button.textContent = zone.name || "Unnamed zone";
            button.addEventListener("click", event => {
                event.stopPropagation();
                openZone(zone);
            });

            item.appendChild(button);
            imageObserver.observe(image);
            return item;
        }

        function displayFeaturedZones(items) {
            featuredContainer.replaceChildren();

            if (!items.length) {
                featuredContainer.textContent = "No featured zones found.";
            } else {
                items.forEach(zone =>
                    featuredContainer.appendChild(createZoneItem(zone))
                );
            }

            document.getElementById("featuredSummary").textContent =
                `Featured Zones (${items.length})`;
        }

        function displayZones(items) {
            container.replaceChildren();

            if (!items.length) {
                container.textContent = "No zones found.";
            } else {
                items.forEach(zone =>
                    container.appendChild(createZoneItem(zone))
                );
            }

            document.getElementById("allSummary").textContent =
                `All Zones (${items.length})`;
        }

        function compareIds(a, b) {
            const first = Number(a.id);
            const second = Number(b.id);

            if (first === -1 && second !== -1) return -1;
            if (second === -1 && first !== -1) return 1;
            if (!Number.isFinite(first)) return 1;
            if (!Number.isFinite(second)) return -1;

            return first - second;
        }

        function sortZones() {
            const mode = sortOptions.value;

            zones.sort((a, b) => {
                if (mode === "name") {
                    return String(a.name || "").localeCompare(
                        String(b.name || ""),
                        undefined,
                        { sensitivity: "base" }
                    );
                }

                if (mode === "id") {
                    return compareIds(a, b);
                }

                return (Number(popularityData[b.id]) || 0) -
                    (Number(popularityData[a.id]) || 0);
            });
        }

        function filterZones() {
            const query = searchBar.value.trim().toLowerCase();
            const matches = zone =>
                String(zone.name || "").toLowerCase().includes(query);

            displayFeaturedZones(
                zones.filter(zone => zone.featured && matches(zone))
            );
            displayZones(zones.filter(matches));
        }

        function saveUIState() {
            try {
                localStorage.setItem("searchQuery", searchBar.value);
                localStorage.setItem("sortOption", sortOptions.value);
                localStorage.setItem(
                    "themeClass",
                    document.body.classList.contains("light-mode")
                        ? "light-mode"
                        : "dark-mode"
                );
            } catch {
                // Storage may be unavailable in private browsing.
            }
        }

        function loadUIState() {
            try {
                searchBar.value = localStorage.getItem("searchQuery") || "";

                const sort = localStorage.getItem("sortOption");
                if (["name", "id", "popular"].includes(sort)) {
                    sortOptions.value = sort;
                }

                if (localStorage.getItem("themeClass") === "light-mode") {
                    document.body.classList.add("light-mode");
                }
            } catch {
                // Use default settings.
            }

            sortZones();
            filterZones();
        }

        async function fetchPopularity() {
            try {
                const response = await fetch(
                    "https://data.jsdelivr.com/v1/stats/packages/gh/" +
                    "gn-math/html@main/files?period=year"
                );

                if (!response.ok) return;

                const data = await response.json();
                const files = Array.isArray(data) ? data : data.files || [];

                files.forEach(file => {
                    const match = String(file.name || "")
                        .match(/\/(\d+)\.html$/);

                    if (match) {
                        popularityData[match[1]] =
                            Number(file.hits?.total) || 0;
                    }
                });
            } catch {
                popularityData = {};
            }
        }

        async function listZones() {
            try {
                const cached = localStorage.getItem("zonesData");

                zones = cached
                    ? JSON.parse(cached)
                    : await (await fetch(addCacheBuster(zonesURL))).json();

                if (!Array.isArray(zones)) {
                    throw new Error("Invalid zones data");
                }

                zones = zones.filter(zone =>
                    zone && typeof zone === "object" && zone.url
                );

                if (zones.length && !zones.some(zone => zone.featured)) {
                    zones[0].featured = true;
                }

                localStorage.setItem("zonesData", JSON.stringify(zones));

                await fetchPopularity();
                loadUIState();

                const id = new URLSearchParams(location.search).get("id");
                const zone = zones.find(item => String(item.id) === String(id));

                if (zone) {
                    await openZone(zone, false);
                }
            } catch (error) {
                container.textContent = "Error loading zones: " + error.message;
            }
        }

        function removeAdvertising(html) {
            const blocked = adPatterns.map(pattern => pattern.source).join("|");

            html = html.replace(
                /<script\b[^>]*(?:src|id|class|data-[^=]+)=["'][^"']*(?:doubleclick|googlesyndication|googletagmanager|google-analytics|adservice|advert|adsystem|popunder|popup|monetag|exoclick)[^"']*["'][^>]*>[\s\S]*?<\/script>/gi,
                ""
            );

            html = html.replace(
                new RegExp(
                    `<(?:iframe|script|ins|div|section|aside)[^>]*(?:id|class|src|data-ad|data-url)=["'][^"']*(?:${blocked})[^"']*["'][^>]*>[\\s\\S]*?<\\/(?:iframe|script|ins|div|section|aside)>`,
                    "gi"
                ),
                ""
            );

            const protection = `
                <style id="ad-blocker-styles">
                    [id*="ad" i],
                    [class*="ad-" i],
                    [class*="ads" i],
                    [class*="advert" i],
                    [class*="popup" i],
                    [class*="popunder" i],
                    [data-ad],
                    iframe[src*="doubleclick" i],
                    iframe[src*="googlesyndication" i],
                    iframe[src*="advert" i] {
                        display: none !important;
                        visibility: hidden !important;
                    }
                </style>
                <script>
                    (() => {
                        const blocked = ${JSON.stringify(adPatterns.map(p => p.source))};
                        const isBlocked = value =>
                            blocked.some(pattern =>
                                new RegExp(pattern, "i").test(String(value || ""))
                            );

                        const clean = root => {
                            root.querySelectorAll(
                                "iframe,script,ins,div,section,aside"
                            ).forEach(element => {
                                const text = [
                                    element.id,
                                    element.className,
                                    element.src,
                                    element.getAttribute("data-ad"),
                                    element.getAttribute("data-url")
                                ].join(" ");

                                if (isBlocked(text)) element.remove();
                            });
                        };

                        clean(document);

                        new MutationObserver(records => {
                            records.forEach(record => {
                                record.addedNodes.forEach(node => {
                                    if (node.nodeType === 1) {
                                        clean(node.parentNode || document);
                                    }
                                });
                            });
                        }).observe(document.documentElement, {
                            childList: true,
                            subtree: true
                        });
                    })();
                <\/script>
            `;

            if (/<head\b[^>]*>/i.test(html)) {
                return html.replace(/<head\b[^>]*>/i, match => match + protection);
            }

            return protection + html;
        }

        function addBaseUrlToHtml(html, sourceUrl) {
            const base = new URL(".", sourceUrl).href
                .replace(/&/g, "&amp;")
                .replace(/"/g, "&quot;");

            const baseTag = `<base href="${base}">`;
            let result = html.replace(/<base\b[^>]*>/i, baseTag);

            if (result === html && /<head\b[^>]*>/i.test(result)) {
                result = result.replace(
                    /<head\b[^>]*>/i,
                    match => match + baseTag
                );
            }

            if (result === html && !/<head\b[^>]*>/i.test(result)) {
                result = baseTag + result;
            }

            return removeAdvertising(result);
        }

        async function fetchZoneHtml(zone) {
            const url = resolveUrl(zone.url);
            const response = await fetch(addCacheBuster(url));

            if (!response.ok) {
                throw new Error("HTTP error " + response.status);
            }

            return {
                html: addBaseUrlToHtml(await response.text(), url),
                url
            };
        }

        async function openZone(zone, updateHistory = true) {
            if (!zone?.url) return;

            const url = resolveUrl(zone.url);

            if (
                /^https?:\/\//i.test(url) &&
                !url.includes("raw.githubusercontent.com")
            ) {
                window.open(url, "_blank", "noopener,noreferrer");
                return;
            }

            loadController?.abort();
            loadController = new AbortController();

            try {
                const response = await fetch(addCacheBuster(url), {
                    signal: loadController.signal
                });

                if (!response.ok) {
                    throw new Error("HTTP error " + response.status);
                }

                currentZone = zone;
                zoneFrame.srcdoc = addBaseUrlToHtml(
                    await response.text(),
                    url
                );

                document.getElementById("zoneName").textContent =
                    zone.name || "Zone";
                document.getElementById("zoneId").textContent = zone.id ?? "";
                zoneAuthor.textContent = "by " + (zone.author || "Unknown");

                if (zone.authorLink) {
                    zoneAuthor.href = resolveUrl(zone.authorLink);
                } else {
                    zoneAuthor.removeAttribute("href");
                }

                zoneViewer.style.display = "flex";
                zoneViewer.setAttribute("aria-hidden", "false");
                document.body.classList.add("no-scroll");

                if (updateHistory) {
                    const pageUrl = new URL(location.href);
                    pageUrl.searchParams.set("id", zone.id);
                    history.pushState(null, "", pageUrl);
                }
            } catch (error) {
                if (error.name !== "AbortError") {
                    alert("Failed to load zone: " + error.message);
                }
            }
        }

        function closeZone(updateHistory = true) {
            loadController?.abort();
            loadController = null;
            exitFullscreenMode();

            zoneFrame.srcdoc = "";
            currentZone = null;
            zoneViewer.style.display = "none";
            zoneViewer.setAttribute("aria-hidden", "true");
            document.body.classList.remove("no-scroll");

            if (updateHistory) {
                const url = new URL(location.href);
                url.searchParams.delete("id");
                history.replaceState(null, "", url);
            }
        }

        async function openInNewTab() {
            if (!currentZone) return;

            const newWindow = window.open("about:blank", "_blank");

            if (!newWindow) {
                alert("Please allow popups for this site.");
                return;
            }

            try {
                const result = await fetchZoneHtml(currentZone);
                newWindow.document.write(result.html);
                newWindow.document.close();
            } catch (error) {
                newWindow.close();
                alert("Failed to open zone: " + error.message);
            }
        }

        async function downloadZone() {
            if (!currentZone) return;

            try {
                const { html } = await fetchZoneHtml(currentZone);
                const blob = new Blob([html], { type: "text/html" });
                const objectUrl = URL.createObjectURL(blob);
                const link = document.createElement("a");

                link.href = objectUrl;
                link.download =
                    (currentZone.name || "zone")
                        .replace(/[<>:"/\\|?*]+/g, "_")
                        .trim() + ".html";

                link.click();
                setTimeout(() => URL.revokeObjectURL(objectUrl), 1000);
            } catch (error) {
                alert("Failed to download zone: " + error.message);
            }
        }

        function enterFullscreenMode() {
            isFullscreen = true;
            zoneViewer.classList.add("game-fullscreen");
            fullscreenBtn.textContent = "Exit Fullscreen";
            zoneViewer.requestFullscreen?.().catch(() => {});
        }

        function exitFullscreenMode() {
            isFullscreen = false;
            zoneViewer.classList.remove("game-fullscreen");
            fullscreenBtn.textContent = "Fullscreen";

            if (document.fullscreenElement) {
                document.exitFullscreen?.().catch(() => {});
            }
        }

        fullscreenBtn.addEventListener("click", () => {
            isFullscreen
                ? exitFullscreenMode()
                : enterFullscreenMode();
        });

        document.addEventListener("fullscreenchange", () => {
            if (!document.fullscreenElement && isFullscreen) {
                isFullscreen = false;
                zoneViewer.classList.remove("game-fullscreen");
                fullscreenBtn.textContent = "Fullscreen";
            }
        });

        function openPopup(title, content) {
            document.getElementById("popupTitle").textContent = title;
            document.getElementById("popupBody").innerHTML = content;
            popupOverlay.style.display = "flex";
        }

        function closePopup() {
            popupOverlay.style.display = "none";
        }

        function showSettings() {
            openPopup("Settings", `
                <label for="colorScheme">Color Scheme:</label>
                <select id="colorScheme">
                    <option value="dark">Default Dark</option>
                    <option value="light">Light</option>
                </select>
                <button id="applyScheme" type="button">Apply Colors</button>
                <button id="resetSaveData" type="button">Reset Saved Data</button>
            `);

            const scheme = document.getElementById("colorScheme");
            scheme.value = document.body.classList.contains("light-mode")
                ? "light"
                : "dark";

            document.getElementById("applyScheme").onclick = () => {
                document.body.classList.toggle(
                    "light-mode",
                    scheme.value === "light"
                );
                saveUIState();
            };

            document.getElementById("resetSaveData").onclick = () => {
                if (confirm("Reset all saved data?")) {
                    localStorage.clear();
                    location.reload();
                }
            };
        }

        function exportData() {
            const data = JSON.stringify(
                Object.fromEntries(
                    Object.keys(localStorage).map(key => [
                        key,
                        localStorage.getItem(key)
                    ])
                ),
                null,
                2
            );

            const url = URL.createObjectURL(
                new Blob([data], { type: "application/json" })
            );

            const link = document.createElement("a");
            link.href = url;
            link.download = "games-data.json";
            link.click();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        function importData(event) {
            const file = event.target.files?.[0];
            if (!file) return;

            const reader = new FileReader();

            reader.onload = () => {
                try {
                    const data = JSON.parse(reader.result);

                    if (!data || typeof data !== "object" || Array.isArray(data)) {
                        throw new Error("Invalid data");
                    }

                    Object.entries(data).forEach(([key, value]) => {
                        if (typeof value === "string") {
                            localStorage.setItem(key, value);
                        }
                    });

                    location.reload();
                } catch {
                    alert("Invalid data file.");
                }

                event.target.value = "";
            };

            reader.readAsText(file);
        }

        document.getElementById("settings")
            .addEventListener("click", showSettings);
        document.getElementById("popupClose")
            .addEventListener("click", closePopup);
        document.getElementById("closeBtn")
            .addEventListener("click", () => closeZone());
        document.getElementById("newTabBtn")
            .addEventListener("click", openInNewTab);
        document.getElementById("downloadBtn")
            .addEventListener("click", downloadZone);
        document.getElementById("importData")
            .addEventListener("change", importData);

        popupOverlay.addEventListener("click", event => {
            if (event.target === popupOverlay) closePopup();
        });

        searchBar.addEventListener("input", debounce(() => {
            filterZones();
            saveUIState();
        }, 300));

        sortOptions.addEventListener("change", () => {
            sortZones();
            filterZones();
            saveUIState();
        });

        document.getElementById("contactLink").onclick = event => {
            event.preventDefault();
            openPopup("Contact", "<p>Email: gn.math.business@gmail.com</p>");
        };

        document.getElementById("privacyLink").onclick = event => {
            event.preventDefault();
            openPopup(
                "Privacy Policy",
                "<p>This site does not intentionally collect sensitive personal information.</p>"
            );
        };

        document.getElementById("exportLink").onclick = event => {
            event.preventDefault();
            exportData();
        };

        document.addEventListener("keydown", event => {
            if (
                event.key === "Escape" &&
                !isFullscreen &&
                zoneViewer.style.display === "flex"
            ) {
                closeZone();
            }
        });

        window.addEventListener("popstate", () => {
            const id = new URLSearchParams(location.search).get("id");

            if (!id) {
                closeZone(false);
                return;
            }

            const zone = zones.find(item => String(item.id) === String(id));
            if (zone && currentZone?.id !== zone.id) {
                openZone(zone, false);
            }
        });

        listZones();
    </script>
</body>
</html>
